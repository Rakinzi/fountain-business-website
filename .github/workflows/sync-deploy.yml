name: Sync to deploy repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to deploy repo
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_REPO_TOKEN}" ]]; then
            echo "::error::DEPLOY_REPO_TOKEN is not configured"
            exit 1
          fi

          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${DEPLOY_REPO_TOKEN}" | base64 -w0)"
          git remote add deploy "https://github.com/Rakinzi/fountain-business-website.git"
          git -c http.extraHeader="${auth_header}" fetch deploy main
          git -c http.extraHeader="${auth_header}" push \
            --force-with-lease=refs/heads/main:refs/remotes/deploy/main \
            deploy HEAD:main
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
