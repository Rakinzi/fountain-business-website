name: Sync to deploy repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to deploy repo
        run: |
          git remote add deploy "https://github.com/Rakinzi/fountain-business-website.git"
          git -c http.extraHeader="Authorization: Basic $(printf 'x-access-token:%s' "${DEPLOY_REPO_TOKEN}" | base64 -w0)" push deploy main
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
